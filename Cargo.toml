[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/module",
    "crates/resolver",
    "tests/harness",
]
default-members = [
    "crates/protocol",
    "crates/module",
    "crates/resolver",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/optimisticmachines/envoy-web-bot-auth"

[workspace.dependencies]
web-bot-auth-protocol = { path = "crates/protocol", version = "0.2.1" }
