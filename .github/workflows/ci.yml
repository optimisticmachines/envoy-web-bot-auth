name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          # v1.7.7 pins the Go module release, not a GitHub Action SHA.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate workflows
        run: actionlint

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - run: make test
      - run: make integration-test
      - run: make transport-test
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check --warn unmaintained

  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: make manifest-check

  kind-gate:
    name: kind-gate
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: envoy-web-bot-auth
          node_image: kindest/node:v1.35.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: make kind-test
      - run: make kind-external-resolver-test
      - run: make kind-portability-test
      - if: failure()
        run: make kind-diagnostics
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-diagnostics
          path: |
            target/e2e-artifacts
            dist
          if-no-files-found: ignore
      - if: always()
        run: make kind-down

  release-artifacts:
    name: release-artifacts
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    needs: [rust, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes skopeo jq
      - run: make release-artifacts-verify

  ci-gate:
    name: ci-gate
    if: always()
    needs: [actions, rust, manifests, kind-gate, release-artifacts, kind-kubernetes-1-34]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify regular gates
        if: >-
          needs.actions.result != 'success' ||
          needs.rust.result != 'success' ||
          needs.manifests.result != 'success'
        run: exit 1
      - name: Verify expensive gates
        if: >-
          (github.event_name == 'merge_group' ||
           github.event_name == 'workflow_dispatch') &&
          (
            needs.kind-gate.result != 'success' ||
            needs.release-artifacts.result != 'success' ||
            needs.kind-kubernetes-1-34.result != 'success'
          )
        run: exit 1
      - run: echo 'all required gates passed'

  kind-kubernetes-1-34:
    name: kind-kubernetes-1-34
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: envoy-web-bot-auth-1-34
          node_image: kindest/node:v1.34.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: make kind-portability-test CLUSTER_NAME=envoy-web-bot-auth-1-34
      - if: always()
        run: make kind-down CLUSTER_NAME=envoy-web-bot-auth-1-34
