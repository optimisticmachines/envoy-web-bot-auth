[package]
name = "envoy-web-bot-auth-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Envoy dynamic module for Web Bot Auth verification with Ed25519"
publish = false

[lib]
name = "envoy_web_bot_auth"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", rev = "b579d07d3ad7ee11d32b105e91a5a39ad24718d7" }
indexmap = "2.12"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sfv = "0.13.0"
web-bot-auth = "=0.7.0"
web-bot-auth-protocol.workspace = true
